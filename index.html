<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residency Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="homepage-signature-wrapper">
        <img id="signature-gif" src="signature2.gif" alt="James E. Craig Signature">
    </div>

    <div class="landing-section">
        <div class="background"></div>
    </div>

    <div class="landing-hero-container">
        <div class="background"></div>
    </div>

    <div id="panels-drawer" class="scrolling-panels-container">
        
        <div class="scroll-panel panel-about" data-target="about.html">
            <div class="panel-hover-bg panel-hover-house"></div>
            <img src="About.png" alt="About Overview" class="panel-title-png">
        </div>

        <div class="scroll-panel panel-apply" data-target="apply.html">
            <div class="panel-hover-bg panel-hover-lake"></div>
            <img src="Apply.png" alt="Apply Now" class="panel-title-png">
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
